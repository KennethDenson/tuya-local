name: Heater
products:
  # DPs read locally (protocol 3.5):
  #   1 - bool - power
  #   4 - mode - comfort, eco, boost (cloud spec lists only eco); selecting
  #       eco switches DP 14 to the heater's own eco set point (77F on test
  #       unit), selecting comfort restores the previous set point; boost
  #       heats at full power regardless of the set point
  #   5 - heat level - level_1, level_2
  #   7 - child lock
  #   10 - display light
  #   11 - work state - standby, heating
  #   12 - power in W
  #   13 - temperature unit - c, f
  #   14 - target temperature in F
  #   15 - current temperature in F
  #   19 - timer - cancel, 1h-6h
  #   20 - remaining timer minutes
  #   21, 102 ("Large"), 104 (bool) - unknown
  - id: hez1tnjv9szsgoyt
    manufacturer: Ballu
    model: NCA1-4.4
entities:
  - entity: climate
    translation_only_key: heater
    dps:
      - id: 1
        name: hvac_mode
        type: boolean
        mapping:
          - dps_val: true
            value: "heat"
          - dps_val: false
            value: "off"
      - id: 4
        name: preset_mode
        type: string
        mapping:
          - dps_val: comfort
            value: comfort
          - dps_val: eco
            value: eco
          - dps_val: boost
            value: boost
      - id: 11
        name: hvac_action
        type: string
        mapping:
          - dps_val: heating
            value: heating
          - dps_val: standby
            value: idle
      - id: 14
        name: temperature
        type: integer
        unit: F
        range:
          min: 40
          max: 86
      - id: 15
        name: current_temperature
        type: integer
        unit: F
  - entity: select
    name: Heat level
    icon: "mdi:radiator"
    dps:
      - id: 5
        type: string
        name: option
        mapping:
          - dps_val: level_1
            value: low
          - dps_val: level_2
            value: high
  - entity: lock
    translation_key: child_lock
    category: config
    dps:
      - id: 7
        type: boolean
        name: lock
  - entity: light
    translation_key: display
    category: config
    dps:
      - id: 10
        type: boolean
        name: switch
  - entity: sensor
    class: power
    dps:
      - id: 12
        type: integer
        name: sensor
        unit: W
        class: measurement
  - entity: select
    translation_key: temperature_unit
    category: config
    dps:
      - id: 13
        type: string
        name: option
        mapping:
          - dps_val: c
            value: celsius
          - dps_val: f
            value: fahrenheit
  - entity: select
    translation_key: timer
    category: config
    dps:
      - id: 19
        type: string
        name: option
        mapping:
          - dps_val: cancel
            value: cancel
          - dps_val: "1h"
            value: "1h"
          - dps_val: "2h"
            value: "2h"
          - dps_val: "3h"
            value: "3h"
          - dps_val: "4h"
            value: "4h"
          - dps_val: "5h"
            value: "5h"
          - dps_val: "6h"
            value: "6h"
  - entity: sensor
    translation_key: time_remaining
    class: duration
    category: diagnostic
    dps:
      - id: 20
        type: integer
        name: sensor
        unit: min
